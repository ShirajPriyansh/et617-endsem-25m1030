<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6f6a">
  <meta name="description" content="Loop Buddy: a gentle 10-minute tutor for Python for loops with range. ET 617 | 25M1030">
  <title>Loop Buddy | ET 617 | 25M1030</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="session" aria-live="off">
      <div class="session-label"><span id="sessionText">0:00 of 10:00</span> <span id="sessionState" class="session-state">paused</span></div>
      <div class="session-track" role="progressbar" aria-label="10-minute session" aria-valuemin="0" aria-valuemax="600" aria-valuenow="0" id="sessionBar">
        <div class="session-fill" id="sessionFill"></div>
      </div>
    </div>
    <button type="button" class="btn btn-stop" data-act="saveStop">Save and stop</button>
  </header>

  <main id="screen" tabindex="-1"></main>

  <footer class="footer">
    <span>ET 617 | 25M1030</span>
    <button type="button" class="linkbtn" data-act="about">About</button>
  </footer>

  <noscript><p class="noscript">Please turn on JavaScript to use Loop Buddy.</p></noscript>

  <script src="data/questions.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
